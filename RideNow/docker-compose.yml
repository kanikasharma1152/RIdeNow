
# =============================================================================
# RideNow — Local Development Orchestration
# =============================================================================
# Usage:
#   docker compose up         — start all services
#   docker compose up -d      — start in background
#   docker compose down -v    — stop & remove volumes
# =============================================================================

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ridenow_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ridenow_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ridenow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ridenow_redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: ridenow_backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-ridenow_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Mount source for local dev hot-reload (remove in production)
      - ./backend:/app
      - /app/venv           # exclude venv from mount
    command: >
      sh -c "python create_tables.py &&
             alembic stamp head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── LiveKit Real-Time Voice Agent Worker (Phase 5) ──────────────────────────
  voice_agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: ridenow_voice_agent
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-ridenow_db}
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
    volumes:
      - ./backend:/app
      - /app/venv           # exclude venv from mount
    command: python -m app.ai.livekit_agent start
    healthcheck:
      test: ["CMD", "python", "-c", "import socket, urllib.parse, os; assert 'livekit_agent' in open('/proc/1/cmdline', 'rb').read().decode('latin1', 'ignore'); u = urllib.parse.urlparse(os.environ.get('LIVEKIT_URL', '')); s = socket.create_connection((u.hostname, 443), timeout=5); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Vite Frontend (dev only) ────────────────────────────────────────────────
  frontend:
    image: node:22-alpine
    container_name: ridenow_frontend
    working_dir: /app
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
      VITE_WS_URL: ws://localhost:${BACKEND_PORT:-8000}/ws
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules    # exclude node_modules from mount
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  ridenow_pgdata:
