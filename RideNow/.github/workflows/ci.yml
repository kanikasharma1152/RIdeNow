name: RideNow CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend Tests ───────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        env:
          # CI uses SQLite — no real DB needed
          DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
          SECRET_KEY: ci-test-secret-key-not-for-production
          ENVIRONMENT: development
          REDIS_URL: ""
          GROQ_API_KEY: ""
        run: |
          pytest -q --tb=short

  # ── Frontend Build ──────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.ridenow.example.com
          VITE_WS_URL: wss://api.ridenow.example.com/ws
        run: npm run build

      - name: Check bundle size
        working-directory: frontend
        run: |
          echo "=== Build output ==="
          ls -lh dist/assets/ | head -20
